name: Autograding Tests

on:
  push:
    paths:
      - 'assignment.py'
      - 'test_assignment.py'
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Ex 1 - Stack set up
        id: ex1_initial_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Stack set up
          command: pytest test_assignment.py::test1_initial_stack
          timeout: 2
          max-score: 1

      - name: Ex 1 - Push
        id: ex1_push
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Push
          command: pytest test_assignment.py::test1_push
          timeout: 2
          max-score: 1

      - name: Ex 1 - Push when full
        id: ex1_push_when_full
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Push when full
          command: pytest test_assignment.py::test1_push_when_full
          timeout: 2
          max-score: 1

      - name: Ex 1 - Pop
        id: ex1_pop
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Pop
          command: pytest test_assignment.py::test1_pop
          timeout: 2
          max-score: 1

      - name: Ex 1 - Pop when empty
        id: ex1_pop_when_empty
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Pop when empty
          command: pytest test_assignment.py::test1_pop_when_empty
          timeout: 2
          max-score: 1

      - name: Ex 1 - Uses TopOfStack
        id: ex1_uses_top_of_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Uses TopOfStack
          command: pytest test_assignment.py::test1_uses_top_of_stack
          timeout: 2
          max-score: 1

      - name: Ex 2 - ShowStack
        id: ex2_show_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - ShowStack
          command: pytest test_assignment.py::test2_show_stack
          timeout: 2
          max-score: 1

      - name: Ex 2 - Ignores old items
        id: ex2_ignores_old_items
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Ignores old items
          command: pytest test_assignment.py::test2_ignores_old_items
          timeout: 2
          max-score: 1

      - name: Ex 2 - Keeps stack
        id: ex2_keeps_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Keeps stack
          command: pytest test_assignment.py::test2_keeps_stack
          timeout: 2
          max-score: 1

      - name: Ex 3 - Binary
        id: ex3_binary
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Binary
          command: pytest test_assignment.py::test3_binary
          timeout: 2
          max-score: 1

      - name: Ex 3 - Starts with empty stack
        id: ex3_starts_with_empty_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Starts with empty stack
          command: pytest test_assignment.py::test3_starts_with_empty_stack
          timeout: 2
          max-score: 1

      - name: Ex 3 - Uses the stack
        id: ex3_uses_the_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Uses the stack
          command: pytest test_assignment.py::test3_uses_the_stack
          timeout: 2
          max-score: 1

      - name: Ex 4 - Editor
        id: ex4_editor
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Editor
          command: pytest test_assignment.py::test4_editor
          timeout: 2
          max-score: 1

      - name: Ex 4 - Stack full
        id: ex4_stack_full
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Stack full
          command: pytest test_assignment.py::test4_stack_full
          timeout: 2
          max-score: 1

      - name: Ex 4 - Starts with empty stack
        id: ex4_starts_with_empty_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Starts with empty stack
          command: pytest test_assignment.py::test4_starts_with_empty_stack
          timeout: 2
          max-score: 1

      - name: Ex 4 - Uses the stack
        id: ex4_uses_the_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Uses the stack
          command: pytest test_assignment.py::test4_uses_the_stack
          timeout: 2
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX1_INITIAL_STACK_RESULTS: "${{ steps.ex1_initial_stack.outputs.result }}"
          EX1_PUSH_RESULTS: "${{ steps.ex1_push.outputs.result }}"
          EX1_PUSH_WHEN_FULL_RESULTS: "${{ steps.ex1_push_when_full.outputs.result }}"
          EX1_POP_RESULTS: "${{ steps.ex1_pop.outputs.result }}"
          EX1_POP_WHEN_EMPTY_RESULTS: "${{ steps.ex1_pop_when_empty.outputs.result }}"
          EX1_USES_TOP_OF_STACK_RESULTS: "${{ steps.ex1_uses_top_of_stack.outputs.result }}"
          EX2_SHOW_STACK_RESULTS: "${{ steps.ex2_show_stack.outputs.result }}"
          EX2_IGNORES_OLD_ITEMS_RESULTS: "${{ steps.ex2_ignores_old_items.outputs.result }}"
          EX2_KEEPS_STACK_RESULTS: "${{ steps.ex2_keeps_stack.outputs.result }}"
          EX3_BINARY_RESULTS: "${{ steps.ex3_binary.outputs.result }}"
          EX3_STARTS_WITH_EMPTY_STACK_RESULTS: "${{ steps.ex3_starts_with_empty_stack.outputs.result }}"
          EX3_USES_THE_STACK_RESULTS: "${{ steps.ex3_uses_the_stack.outputs.result }}"
          EX4_EDITOR_RESULTS: "${{ steps.ex4_editor.outputs.result }}"
          EX4_STACK_FULL_RESULTS: "${{ steps.ex4_stack_full.outputs.result }}"
          EX4_STARTS_WITH_EMPTY_STACK_RESULTS: "${{ steps.ex4_starts_with_empty_stack.outputs.result }}"
          EX4_USES_THE_STACK_RESULTS: "${{ steps.ex4_uses_the_stack.outputs.result }}"
        with:
          runners: ex1_initial_stack,ex1_push,ex1_push_when_full,ex1_pop,ex1_pop_when_empty,ex1_uses_top_of_stack,ex2_show_stack,ex2_ignores_old_items,ex2_keeps_stack,ex3_binary,ex3_starts_with_empty_stack,ex3_uses_the_stack,ex4_editor,ex4_stack_full,ex4_starts_with_empty_stack,ex4_uses_the_stack
